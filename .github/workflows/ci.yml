name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build plugin package with Node.js 24
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-knowledge-package
          path: dist/*.tgz
